add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = false
home_symbol = " "
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
format = "([\\[$all_status $ahead_behind\\]]($style) )"
style = "yellow"
modified = "*"
staged = "+"
untracked = "?"
ahead = "⇡"
behind = "⇣"

[cmd_duration]
min_time = 500
format = "took [$duration](bold yellow) "

[username]
show_always = false
style_user = "bold white"

[hostname]
ssh_only = true
style = "bold dimmed"

